<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Organização da Formatura — ETeses</title>
  <link rel="stylesheet" href="style.css">
<style>
.last-update{width:100%;text-align:center;font-size:10px;line-height:1.3;color:#8a8f98;margin:18px 0 10px;padding:0 12px;font-weight:400;}
</style></head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="eteses.png" alt="ETeses" class="logo">
    <div class="brand-divider"></div>
    <div>
      <div class="eyebrow">ETeses</div>
      <h1>Organização da Formatura</h1>
      <p>Técnico de Enfermagem</p>
    </div>
  </div>
  <button id="btnNew" class="primary">+ Novo tópico</button>
</header>

<main class="container">
  <section class="stats" id="stats"></section>

  <section class="toolbar">
    <input id="search" placeholder="🔎 Buscar tópico, decisão ou categoria...">
    <select id="statusFilter">
      <option value="">Todos os status</option>
      <option value="draft">Rascunho</option>
      <option value="voting">Em votação</option>
      <option value="approved">Aprovado</option>
      <option value="rejected">Rejeitado</option>
      <option value="archived">Arquivado</option>
    </select>
    <select id="categoryFilter"><option value="">Todas as categorias</option></select>
  </section>

  <div class="tabs">
    <button class="tab active" data-tab="all">📋 Tópicos</button>
    <button class="tab" data-tab="voting">🗳️ Votações</button>
    <button class="tab" data-tab="approved">📜 Decisões oficiais</button>
    <button class="tab" data-tab="pending">⚠️ Pendências</button>
  </div>

  <section id="topics"></section>
</main>

<dialog id="topicDialog">
  <form id="topicForm" method="dialog">
    <button type="button" class="close" id="closeDialog">×</button>
    <div class="dialog-brand"><img src="eteses.png" alt="ETeses"></div>
    <h2 id="dialogTitle">Novo tópico</h2>
    <label>Título<input id="title" required maxlength="160"></label>
    <label>Categoria<input id="category" required maxlength="80" placeholder="Ex.: Professores"></label>
    <label>Tipo
      <select id="topicType">
        <option value="decision">📌 Decisão</option>
        <option value="information">ℹ️ Informação</option>
        <option value="suggestion">💡 Sugestão</option>
        <option value="task">📋 Tarefa</option>
      </select>
    </label>
    <label>Statement / conteúdo da proposta<textarea id="statement" required rows="6" placeholder="Escreva exatamente aquilo que será aprovado ou rejeitado."></textarea></label>
    <label>Prioridade
      <select id="priority"><option value="high">🔴 Alta</option><option value="medium" selected>🟡 Média</option><option value="low">🟢 Baixa</option></select>
    </label>
    <button class="primary full" type="submit">Salvar tópico</button>
  </form>
</dialog>

<dialog id="viewDialog">
  <div id="viewContent"></div>
  <button class="secondary full close-view" id="closeView">Fechar</button>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<div class="last-update" aria-label="Última atualização"><span id="lastUpdate">Última atualização: carregando...</span></div>
<script>
(async()=>{
  const el=document.getElementById("lastUpdate");
  try{
    const response=await fetch("https://api.github.com/repos/leorbr27/Organizacao_formatura/commits?per_page=1");
    if(!response.ok) throw new Error("GitHub API");
    const commits=await response.json();
    const iso=commits?.[0]?.commit?.committer?.date;
    if(!iso) throw new Error("Commit não encontrado");
    const date=new Date(iso);
    const parts=new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(date);
    const get=t=>parts.find(p=>p.type===t)?.value||"";
    el.textContent="Última atualização: "+get("day")+"/"+get("month")+"/"+get("year")+", "+get("hour")+":"+get("minute");
  }catch(e){
    console.error("Não foi possível obter o último commit do GitHub:",e);
    el.textContent="Última atualização: indisponível";
  }
})();
</script>
</body>
</html>
